name: Keep the list awake

# A free Supabase project with too little database activity for seven days gets
# paused, and a paused project is a signup form that fails silently. One read a
# day keeps it out of that state, and it costs nothing.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Derived from the secret the deploy already uses, rather than a second
      # copy of the project URL: the failure mode of a stale copy here is
      # exactly the silent pause this job exists to prevent.
      - name: Read one row
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
        run: |
          if [ -z "$DISPATCH_URL" ]; then
            echo "DISPATCH_URL is unset — nothing to keep awake yet."
            exit 0
          fi
          curl -sSf "${DISPATCH_URL%/dispatch}/health"
