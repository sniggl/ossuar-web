name: Keep the list awake

# A free Supabase project with too little database activity for seven days gets
# paused, and a paused project is a signup form that fails silently. One read a
# day is enough to keep it out of that state, and it costs nothing.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://gxgsvusfefheybvlsllf.supabase.co/functions/v1/health)
          echo "health answered $code"
          test "$code" = "200"
