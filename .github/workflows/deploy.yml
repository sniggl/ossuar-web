name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push supersedes a queued one, but never cancels
# a run that is already mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The mail goes out only after the entry is actually readable: the link in it
  # points at the page this job just published. `dispatch` decides what is new,
  # so this runs on every push and sends nothing when nothing is.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/notify.ts
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
